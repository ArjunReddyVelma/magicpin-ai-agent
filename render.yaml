# Render Blueprint Specification for Magicpin AI Agent (Educational / Free-Tier)
# Architecture:
# - PostgreSQL Database: Ephemeral 30-day Free PostgreSQL (max 1 GB, testing/educational)
# - Web Service (Backend): Free FastAPI web service (single-instance) with startup Alembic migrations
# - Static Site (Frontend): Free React SPA hosted on global CDN

version: "1"

services:
  # Backend API Web Service
  - type: web
    name: magicpin-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    # Note: Free web services do not support preDeployCommand.
    # In single-instance free tier, migrations execute safely at startup prior to port binding.
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "Magicpin AI Agent"
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: magicpin-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: magicpin-frontend
          property: host
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false  # Sensitive secret: configure securely in Render dashboard
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: LOG_LEVEL
        value: INFO
      - key: SESSION_TTL_MINUTES
        value: "10080"
      - key: RATE_LIMIT_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        value: "900"

  # Frontend Static Application
  - type: web
    name: magicpin-frontend
    runtime: static
    # Note: Static sites are hosted on Render's global CDN, are free by default, and do not accept a plan field.
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      # API Proxy Rewrite: routes /v1/* to the backend web service preserving path and cookies.
      # Note: 'https://magicpin-backend.onrender.com' assumes default subdomain availability.
      # If Render allocates a suffixed hostname (e.g. magicpin-backend-xxxx.onrender.com),
      # update this destination to match the actual allocated backend URL.
      - type: rewrite
        source: /v1/*
        destination: https://magicpin-backend.onrender.com/v1/*
      # SPA Catch-all: routes all other paths to index.html for client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Ephemeral PostgreSQL Persistence (Free Tier / Educational)
  # IMPORTANT NOTICE:
  # - Render Free PostgreSQL instances expire 30 days after creation.
  # - Free databases have no automated backups and are not durable storage.
  # - Max 1 GB storage, 0.1 CPU, 256 MB RAM, max 100 concurrent connections.
  # - Suitable strictly for educational demonstration, development, and testing.
  - name: magicpin-postgres
    databaseName: magicpin_ai_agent
    user: magicpin
    region: oregon
    plan: free
    postgresMajorVersion: 16
