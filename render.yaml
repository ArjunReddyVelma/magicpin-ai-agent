# Render Blueprint Specification for Magicpin AI Agent
# Architecture:
# - PostgreSQL Database: Managed relational persistence with foreign-key cascades
# - Web Service (Backend): FastAPI application with Alembic pre-deploy migrations
# - Static Site (Frontend): Single-page React application with Vite and Tailwind

version: "1"

services:
  # Backend API Web Service
  - type: web
    name: magicpin-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "Magicpin AI Agent"
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: magicpin-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: magicpin-frontend
          property: host
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false  # Sensitive secret: configure securely in Render dashboard
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: LOG_LEVEL
        value: INFO
      - key: SESSION_TTL_MINUTES
        value: "10080"
      - key: RATE_LIMIT_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: RATE_LIMIT_LOGIN_WINDOW_SECONDS
        value: "900"

  # Frontend Static Application
  - type: web
    name: magicpin-frontend
    runtime: static
    region: oregon
    plan: starter
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://magicpin-backend.onrender.com/v1/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Persistence
  - name: magicpin-postgres
    databaseName: magicpin_ai_agent
    user: magicpin
    region: oregon
    plan: starter
    postgresMajorVersion: 16
